# railway.toml — Railway.app deployment configuration
# Docs: https://docs.railway.app/reference/config-as-code

[build]
builder = "DOCKERFILE"
dockerfilePath = "docker/Dockerfile"

[deploy]
startCommand = "uvicorn qanun.api.main:get_app --factory --host 0.0.0.0 --port $PORT"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
healthcheckPath = "/health"
healthcheckTimeout = 30

# The Railway service named "qanun-api" must exist in the project (create it once in the
# dashboard or with `railway service add`); `railway up --service qanun-api` targets it.
