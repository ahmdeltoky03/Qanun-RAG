groups:
  - name: rag-quality
    rules:
      - alert: FaithfulnessLow
        expr: rag_faithfulness < 0.80 and rag_eval_report_age_seconds > 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "Faithfulness {{ $value | printf \"%.2f\" }} is below 0.80 ({{ $labels.deployment }})"
          description: "Latest offline RAGAS/proxy run fell under the quality bar. Open the failing traces in Langfuse (score name: faithfulness)."
      - alert: EvalReportStale
        expr: rag_eval_report_age_seconds > 7 * 24 * 3600
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "No evaluation run for over 7 days" }
      - alert: QueryDrift
        expr: rag_query_drift_cosine > 0.25
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Query embeddings drifted (cosine distance {{ $value | printf \"%.2f\" }})"
          description: "Users are asking different questions than the evaluation set covers. Refresh the eval set and re-run the evaluation."
  - name: rag-service
    rules:
      - alert: HighLatencyP95
        expr: histogram_quantile(0.95, sum by (le, release) (rate(rag_request_seconds_bucket[5m]))) > 5
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "p95 /ask latency above 5s ({{ $labels.release }})" }
      - alert: HighErrorRate
        expr: sum by (release) (rate(rag_requests_total{outcome="error"}[5m])) / sum by (release) (rate(rag_requests_total[5m])) > 0.05
        for: 5m
        labels: { severity: critical }
        annotations: { summary: "More than 5% of /ask requests fail ({{ $labels.release }})" }
      - alert: EmptyIndex
        expr: rag_documents_indexed == 0
        for: 1m
        labels: { severity: critical }
        annotations: { summary: "Vector index is empty" }
      - alert: GuardrailSpike
        expr: sum(rate(rag_guardrail_total{code=~"prompt_injection|blocked.*"}[5m])) > 0.5
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "Spike in blocked prompt-injection attempts" }
