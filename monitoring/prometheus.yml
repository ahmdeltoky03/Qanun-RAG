global: { scrape_interval: 15s, evaluation_interval: 15s }
rule_files: [/etc/prometheus/alerts.yml]
alerting: { alertmanagers: [{ static_configs: [{ targets: ["alertmanager:9093"] }] }] }
scrape_configs:
  # Hybrid dev mode (default): the API runs NATIVELY in WSL2 via `make run` (bound to
  # 0.0.0.0:8000), and Prometheus reaches it through Docker Desktop's host gateway.
  # For the full-Docker stack (`docker compose up`, which runs api + api-canary inside the
  # compose network), swap the target back to "api:8000" / "api-canary:8000".
  - job_name: rag-api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]
        labels: { deployment: stable }
      # - targets: ["api-canary:8000"]   # full-Docker canary deployment only
      #   labels: { deployment: canary }
