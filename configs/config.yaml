# ═══════════════════════════════════════════════════════════════════
# RAGGuide — Main Configuration (override with environment variables)
# ═══════════════════════════════════════════════════════════════════

# ── Embedding Model ─────────────────────────────────────────────────
embedding:
  provider: openai                         # openai | hashing | cohere | sentence-transformers
  model: bge-m3                            # ollama model name
  base_url: http://localhost:11434/v1      # ollama local  |  ngrok public URL on Colab
  api_key: ollama
  dimensions: 1024                         # bge-m3 default

# ── LLM ─────────────────────────────────────────────────────────────
llm:
  provider: openai                         # openai-compatible
  model: gpt-oss:20b                       # ollama model name
  base_url: http://localhost:11434/v1      # ollama local  |  ngrok public URL on Colab
  api_key: ollama
  temperature: 0.1
  max_tokens: 1024

# ── Retrieval ────────────────────────────────────────────────────────
retrieval:
  top_k: 5
  rrf_k: 60
  min_score: 0.0                           # 0.0 = disabled; raise to reject OOS questions
  min_coverage: 0.0

# ── Vector Store ─────────────────────────────────────────────────────
vectorstore:
  type: qdrant
  index_dir: data/index

# ── Guardrails ────────────────────────────────────────────────────────
guardrails:
  block_injection: true
  mask_pii: true

# ── Observability ────────────────────────────────────────────────────
observability:
  enable_langfuse: false
  langfuse_public_key: pk-lf-local
  langfuse_secret_key: sk-lf-local
